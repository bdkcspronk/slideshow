# Francken TV configuration.
# Times are 24-hour "HH:MM". Relative paths are relative to the project folder.
# Restart the slideshow after changing this file.
# Sound, quotes aloud, greetings, volume, slide speed and which slide types are shown can also be
# changed on the TV (Esc -> Settings); those choices are saved in data/settings.json and win over
# the values here. Delete that file to go back to these.

[display]
seconds_per_slide = 8        # default for slides that don't set their own "seconds"
screen_width = 1920          # large images are scaled down to this size
screen_height = 1080

[server]
host = "127.0.0.1"
port = 8080

[rotation]
# The slide types in each round. Remove a name to disable that slide type.
order = ["images", "activities", "practice", "news", "weather", "buses", "timetable", "event_photos", "presence", "puzzles", "spotify", "leaderboard", "lyric_video", "books", "quote", "commandments", "confidential", "ero", "extern", "poll", "pet", "xkcd", "graafmachine", "compucie", "borrelcie", "fotocie", "membership", "socks", "socials", "streep", "instagram", "francken_vrij", "francken_vrij_subscribe", "bieruur_countdown"]
# The other slide types are spread evenly between these slides, in the order above.
fill_with = "images"
# These slide types are only shown in the daytime: from daytime_from until bieruur (bieruur.time),
# or until daytime_until if that's set. Their shortcut keys still work at any time. Outside the
# daytime, the weather still shows a rain warning when rain is expected within 2 hours.
daytime_only = ["news", "weather", "buses", "timetable", "books"]
daytime_from = "08:00"
daytime_until = "18:00"
# The info slides: these take turns, one of them per round (the next one that has something to show),
# in the place of the first of them in the order above.
take_turns = ["news", "weather", "buses", "timetable"]

[update]
# Every check_minutes the slideshow looks for new commits on GitHub. If there are, and this copy has
# no changes of its own, it pulls them, runs the tests and restarts (not during bieruur). If the
# tests fail it stays on the version it runs. auto = false: only by hand (git pull, then Ctrl+R).
auto = true
check_minutes = 10

[shortcuts]
# Number keys in the slideshow that jump straight to a slide type; these slide types are also the
# previews in the menu (Esc). While typing in a puzzle or the Spotify search, numbers are typed
# instead. Any name from rotation.order works.
"1" = "puzzles"
"2" = "spotify"
"3" = "presence"             # today's activity chart from the sniffer
"4" = "news"
"5" = "weather"
"6" = "buses"
"7" = "timetable"

[power]
# The Power button in the menu (Esc). Ubuntu lets the logged-in desktop user do these without a password.
shutdown = ["systemctl", "poweroff"]
restart = ["systemctl", "reboot"]

[images]
folder = "media/slides"      # drop images here; new files are picked up automatically
shuffle = false

[activities]
url = "https://professorfrancken.nl/association/activities"
max_events = 10
refresh_minutes = 30
seconds = 15

[practice]
# Practice sessions in the next two weeks (activities with "practice session" in their title, from the
# activities above), as a poster; the slide is only there while there are some.
days_ahead = 14
seconds = 15

# The info slides: news, weather, buses and timetable take turns (rotation.take_turns).
[news]
seconds = 15
feeds = [
	["Dagblad van het Noorden", "https://www.dvhn.nl/rss"],
	["NU.nl", "https://www.nu.nl/rss/Algemeen"],
	["BBC World", "https://feeds.bbci.co.uk/news/world/rss.xml"],
]
headlines_per_feed = 3          # one feed per slide, the next feed each time it comes round

[weather]
seconds = 15
place = "Zernike campus"
location = [53.2406, 6.5364]

[buses]
seconds = 15
stop_name = "Aletta Jacobshal"
stop_codes = ["10004120"]   # timing point codes: the side towards the city centre (Hoofdstation); the other side is 10004110. OVapi still calls this stop "Crematoriumlaan" (stop_ifopt in the national GTFS stops.txt)
departures_shown = 8
walk_minutes = 2                # from the association to the stop: buses leaving sooner are left out
# line_colors = { "1" = ["#00be46", "#000000"] }   # per line [background, text]; default: Qbuzz's Groningen city lines (BUS_LINE_COLORS in providers/buses.py)

[timetable]
seconds = 25                    # the timetable has the most to read
name = "Applied Physics"
programmes = [["BSc Applied Physics", 1], ["BSc Applied Physics", 2], ["BSc Applied Physics", 3], ["MSc Applied Physics", 1]]
next_day_from_hour = 18         # from this hour on, the next day's timetable

[books]
# Second-hand books for sale on the website: a few per slide, the next few in the next round.
url = "https://professorfrancken.nl/study/books"
books_per_slide = 3
seconds = 15
refresh_hours = 6

[event_photos]
server = "https://nextcloud.professorfrancken.nl"
credentials = "~/.config/slideshow/nextcloud.credentials.json"
albums_folder = "images/albums"   # contains <year>/<YYYY-MM-DD>-<event name>/ folders
recent_events = 3                 # pick photos from this many most recent events
photos_per_event = 20             # photos downloaded from each event every refresh (fewer if it has fewer; the others make up the rest)
photos_per_round = 1              # photos shown per round of the slideshow; all of a batch are shown before any comes back
refresh_minutes = 1440        # checked for a new comic once a day (just after midnight), and at start
seconds = 10

[presence]
database = "data/presence.sqlite3"
devices = "config/devices.json"   # MAC address -> name, colours, chart style, greeting
seconds = 15
greet_arrivals = true
day_starts_at = "04:00"           # a new day (new greetings, an empty activity chart) starts at this time

[spotify]
# What's playing on Spotify and the next song; tap to change the playlist. Only shown while something
# plays. Setup: docs/setup/spotify.md.
credentials = "~/.config/slideshow/spotify.json"
redirect_uri = "http://127.0.0.1:8080/spotify/callback"   # must match the app at developer.spotify.com
speaker = "Francken TV"      # the TV PC's own Spotify speaker (spotifyd, deploy/spotifyd.conf)
show_when_idle = true        # nothing playing: still show the slide, with the last song paused
play_on_start = true         # when the slideshow starts and nothing plays: resume the last music on the speaker
start_playlist = ""          # ...or, if there's nothing to resume, this one (a "spotify:playlist:..." uri)
bieruur_volume = 30          # during the bieruur song: the music this quiet (% of how loud it was), then back
check_every_seconds = 5
seconds = 15

[lyric_video]
# The song playing on Spotify as a lyric video: the line being sung, big, each line in its own style.
# Only after bieruur (until rotation.daytime_from the next morning), and only while a song plays that
# has synced lyrics (from lrclib.net). Its shortcut key works at any time. Uses the [spotify] login.
seconds = 30
check_every_seconds = 5      # how soon after a song starts its lyrics are looked up

[leaderboard]
# Who spent the most time in the room this week (since Monday).
top = 10
seconds = 12

[quote]
sheet_id = "12hadm3_zdeU7e3q-YHFfcNSDocQdzjWKnn7lzZLqhI4"   # Google Sheet with "Quote" and "name" columns
blocked_words = "config/quote_filter.txt"   # quotes containing these words are never shown
narrate = false                             # read quotes aloud? Also: Ctrl+M in the terminal, "m" or Esc -> Settings in the browser
letter_ms = 45                              # the quote is typed letter by letter at this speed...
max_typing_seconds = 8                      # ...but long quotes type faster, to finish within this time
seconds = 6                                 # reading time after the quote is typed and the author shown
refresh_hours = 6

[commandments]
# Jeff de Hosson's commandment of the week: the next one from the file every Monday, in order.
file = "config/commandments.txt"   # one commandment per line
seconds = 12

[graafmachine]
# An animated graafmachine digging a hole and dumping the earth on a heap.
seconds = 14   # the length of the animation

[compucie]
# The Compucie's promo, Matrix style (the text is in templates/slides/compucie.html).
seconds = 18   # the terminal has typed everything after about 12 s

[borrelcie]
# The Borrelcie's promo after the Beatles: a piano keyboard playing, then THE BORRELCIE (all in templates/slides/borrelcie.html).
seconds = 17   # the leg has grown out after about 14 s

[fotocie]
# The Fotocie's promo: their logo with the animation of the Fotocie app's start screen (templates/slides/fotocie.html).
seconds = 8   # the animation takes 2.6 s, the rest is the logo staying

[membership]
# Become a member: what it costs and gives (the text is in templates/slides/membership.html) and a QR code to the form.
link = "https://professorfrancken.nl/register"
months = [8, 9, 10, 2]   # only in these months (1 is January): the start of the academic year and of the second semester
seconds = 15   # everything is in after about 5 s

[socks]
# Francken socks for sale: the price and a QR code that opens WhatsApp to the seller (the text is in templates/slides/socks.html).
link = "https://wa.me/31653346489"
price = "€7,20"
seconds = 15   # everything is in after about 4 s

[socials]
# Where to find us: a QR code for each of these links, as polaroids on a washing line (the names under them are in
# templates/slides/socials.html). Leave one empty ("") to leave it out.
whatsapp = "https://chat.whatsapp.com/JhyvxwWNQU5IP9h4YK5CFp"   # the announcement group
linkedin = "https://linkedin.com/company/t.f.v.-professor-francken"
instagram = "https://instagram.com/tfvprofessorfrancken"
website = "https://professorfrancken.nl"
seconds = 15   # everything is in after about 4 s

[streep]
# Streep your food on the PC next to the fridge: a cursor tapping snacks in the streep system (the snacks, prices and taps are in providers/streep.py).
seconds = 14   # the last streep is drawn after about 12 s

[francken_vrij]
# The latest Francken Vrij, its pages turning by themselves, pausing on the cover, the contents and each article's
# start (its bookmarks). The newest PDF in the folder is shown; without one there's no slide. The slide lasts as long
# as the pages take. Needs poppler (sudo apt install poppler-utils). How: docs/04-common-changes.md, "A new Francken Vrij".
folder = "media/francken-vrij"
turn_seconds = 0.9     # one page turning over
pause_seconds = 5      # on the cover, the contents and the start of each article
glance_seconds = 0.7   # on the other pages

[francken_vrij_subscribe]
# Get the Francken Vrij on paper: how to opt in on the website, with the latest cover (from [francken_vrij] above)
# and a QR code to the page (the text is in templates/slides/francken_vrij_subscribe.html).
link = "https://professorfrancken.nl/profile/francken-vrij"
seconds = 15   # everything is done after about 6 s

[instagram]
# Our latest Instagram posts on a phone, with a QR code to the account. Setup: docs/setup/instagram.md.
username = "tfvprofessorfrancken"   # shown (with the QR code) while not connected; once connected, from Instagram
credentials = "~/.config/slideshow/instagram.json"
posts = 4          # the latest this many, scrolling by on the phone (fewer: slower)
seconds = 20

[confidential]
# The confidential contact persons: who they are is in config/confidential.json (personal data, not in
# git; the format is in francken_tv/providers/confidential.py), their photos in media/confidential/.
# Without that file the slide is left out.
seconds = 15

[ero]
# The emergency response officers: every picture in media/ERO/ is one, the file name is the name
# (media/ERO/Alex.png). Without pictures the slide is left out.
seconds = 15

[extern]
# The extern ("Internship? Job? Thesis?" and how to reach them): the text is in config/extern.json
# (personal data, not in git; the format is in francken_tv/providers/extern.py), the photo and the
# background in media/extern/. Without that file the slide is left out.
seconds = 15

[pet]
# The Francken pet: a tamagotchi people feed, play with and clean by tapping the TV, or it dies. Its needs only go
# down while people are in the room (known devices the sniffer saw in the last presence_minutes), faster with more
# people, but at most so much a day that three visits a day keep it alive (providers/pet.py). The first time and
# after it died, the slide asks for its name. It's only in the slideshow while one of its bars is below half (or it
# waits for a name, or it died); the menu (Esc) shows it any time. Its state is in data/pet.json (delete it to start over).
seconds = 20
presence_minutes = 10
streep_credentials = "~/.config/slideshow/streep.json"   # {"password": "..."} of the streep system: each streep feeds it (+1) and it says thank you
cry_minutes = 20   # below half health it cries on the speakers about this often (not while muted or during bieruur)

[poll]
# The weekly dilemma: vote on the TV, or scan the QR code and vote on a Google Form (docs/setup/weekly-dilemma.md).
file = "config/dilemmas.txt"   # one per line: question | option A | option B; the next one every Monday
form_url = "https://forms.gle/TkEbfZ8BVj4Q7LJ38"   # the Google Form's link (the QR code); empty: no QR code, TV votes only
sheet_id = "1z4w-yIFYOSmDGzTRwJ77JXkWqafn8zo5RpLvt9GMVbY"   # the form's responses sheet, shared as "anyone with the link can view"
timestamp_day_first = false    # the sheet's timestamps are 10/19/2026 (American); true: 19-10-2026 (Dutch/British). Worked out from the sheet once a date after the 12th is in it
refresh_minutes = 2            # how often the form's votes are read
seconds = 15

[xkcd]
# The latest xkcd comic, with its hover text.
seconds = 15
every_minutes = 60            # in the rotation at most once an hour
refresh_minutes = 1440        # checked for a new comic once a day (just after midnight), and at start

[puzzles]
# The Daily puzzles slide: one half per puzzle, tap one to play it.
order = ["connections", "wordle", "catfishing", "timeguessr"]
seconds = 20

[connections]
# The New York Times "Connections" puzzle of the day.
show_yesterday = true         # also show yesterday's answers next to today's puzzle

[wordle]
# The New York Times Wordle of the day.
show_yesterday = true         # also show yesterday's word

[timeguessr]
# The timeguessr.com daily challenge: five photos, guess where (on the map) and when (the year).
first_year = 1900             # the year slider runs from here to this year, as on the site

[maps]
# Map tiles for maps in slides (TimeGuessr). The slideshow fetches each tile once and keeps it in
# data/cache/tiles, as OpenStreetMap's tile policy asks.
tiles = "https://tile.openstreetmap.org/{z}/{x}/{y}.png"
attribution = "&copy; OpenStreetMap contributors"

[bieruur]
time = "16:00"
takeover_minutes_before = 2   # the countdown fills the screen from 15:58 ...
takeover_minutes_after = 2    # ... until 16:02
countdown_seconds = 5         # how long the countdown is shown during a normal round
beer_fills_from = "08:00"     # the countdown's background fills up with beer from this time until bieruur
days = ["monday", "tuesday", "wednesday", "thursday", "friday", "saturday", "sunday"]
songs_folder = "media/bieruur"
choose_song_minutes_before = 10

[bieruur.song_offsets]
# Seconds relative to bieruur at which a song starts; negative starts early
# so that the drop lands exactly at bieruur.
"toby.mp3" = -39
"gdn.sci.090701.sc.moon-countdown-launch.mp3" = -34   # the Apollo launch countdown: lift-off at bieruur

[vrijmibo]
file = "media/vrijmibo.gif"
weekday = "friday"
every_minutes = 15

[sound]
# Keep the sound on the line-out (the speakers, "Line Out - Built-in Audio"), not the TV's HDMI: at
# startup and when the speakers are plugged in, checked every check_seconds. false: leave it alone.
line_out = true
check_seconds = 30

[announcer]
voice = "en_US-ryan-high"        # piper voice, stored in voices_folder
voices_folder = "media/voices"
volume = 100
length_scale = 1.2               # speaking speed: higher is slower
download_voice = true            # the voice model missing: download it by itself (nothing is spoken until it is there)

[sniffer]
port = "/dev/ttyUSB0"
baud = 115200
log_every_seconds = 1        # log each device at most this often
keep_days = 7
log_unknown_devices = false  # same as the old "--all" flag
