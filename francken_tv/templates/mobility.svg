<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 100" aria-hidden="true">
	<!-- A mobility scooter ("mobility" in devices.json), facing right, wheels at the bottom (the dust from both
	     wheels in style.css is placed for this). Drawn inline by presence.html: the
	     class="paint" parts take the person's colour (--paint), the class="paint-dark" parts a darker shade. -->
	<!-- The safety flag on its pole, behind the seat -->
	<path d="M28 62 L 19 3" stroke="#c9ccd2" stroke-width="1.6" stroke-linecap="round"/>
	<path d="M19 3 L 3 8 L 20 13 Z" fill="#ff7a00"/>
	<!-- The body: a low deck with a rounded shell, the front shroud over the front wheel -->
	<path class="paint" d="M26 62 Q 26 54 36 54 H 98 L 112 46 Q 124 42 132 52 L 136 70 Q 136 76 128 76 H 34 Q 26 76 26 68 Z" fill="#c8102e"/>
	<path d="M44 68 H 112" stroke="rgba(0, 0, 0, 0.25)" stroke-width="2" stroke-linecap="round"/>
	<path d="M104 52 Q 122 44 130 56" fill="none" stroke="rgba(255, 255, 255, 0.35)" stroke-width="2.5" stroke-linecap="round"/>
	<!-- Wheels: small and solid -->
	<g>
		<circle cx="44" cy="80" r="14" fill="#1b1b1f"/>
		<circle cx="120" cy="82" r="12" fill="#1b1b1f"/>
		<circle cx="44" cy="80" r="6" fill="#c9ccd2"/>
		<circle cx="120" cy="82" r="5" fill="#c9ccd2"/>
		<circle cx="44" cy="80" r="2" fill="#55585f"/>
		<circle cx="120" cy="82" r="2" fill="#55585f"/>
	</g>
	<!-- The captain's chair: a big padded seat, a tall backrest and an armrest -->
	<path d="M46 56 V 48 Q 46 44 50 44 H 76 Q 80 44 80 48 V 56 Z" fill="#55585f"/>
	<path class="paint-dark" d="M35 48 Q 31 46 31 40 L 33 10 Q 34 3 40 3 H 43 Q 49 3 48 10 L 47 42 Q 47 48 43 48 Z" fill="#7a0a1c"/>
	<path d="M35 14 Q 40 12 45 14 M34 24 Q 40 22 45 24" fill="none" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5" stroke-linecap="round"/>
	<path class="paint-dark" d="M36 44 Q 34 32 44 32 H 84 Q 90 32 90 39 Q 90 46 84 46 H 42 Q 37 46 36 44 Z" fill="#7a0a1c"/>
	<path d="M60 32 V 25 Q 60 22 63 22 H 82 Q 86 22 86 25 Q 86 28 82 28 H 66" fill="none" stroke="#2a2c31" stroke-width="3" stroke-linecap="round"/>
	<!-- The tiller up to the handlebar, with a basket in front -->
	<path d="M110 50 L 100 22" stroke="#2a2c31" stroke-width="5" stroke-linecap="round"/>
	<path d="M94 20 H 106" stroke="#1b1b1f" stroke-width="3.5" stroke-linecap="round"/>
	<path d="M104 28 H 126 L 122 44 H 108 Z" fill="none" stroke="#c9ccd2" stroke-width="2" stroke-linejoin="round"/>
	<path d="M109 28 L 111 44 M115 28 V 44 M121 28 L 119 44 M106 36 H 124" stroke="#c9ccd2" stroke-width="1"/>
	<!-- Headlight -->
	<circle cx="132" cy="58" r="3.5" fill="#ffe08a"/>
</svg>
