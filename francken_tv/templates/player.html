<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<title>Francken TV</title>
	<link rel="stylesheet" href="/static/vendor/leaflet/leaflet.css">
	<link rel="stylesheet" href="/static/style.css">
</head>
<body>
	<!-- Two layers: the next slide loads in the hidden one, then they swap with a fade. -->
	<div class="layer" id="layer-a"></div>
	<div class="layer" id="layer-b"></div>
	<div id="overlay"></div>   <!-- shown over any slide for a few seconds: /api/overlay (player.js, "Overlays") -->
	<div id="menu" hidden></div>   <!-- Esc: previews, settings, power (player.js, "The menu") -->
	<div id="message" hidden></div>   <!-- a short message over everything, e.g. a shortcut with nothing to show (showMessage in player.js) -->
	<div id="voice-help" aria-hidden="true"></div>   <!-- "Hey Katinka, help": what people can say (player.js, "Voice commands") -->
	<div id="listening" data-state="listening" aria-hidden="true">   <!-- voice commands: "Hey Katinka" heard, then what came of it (player.js, "Voice commands") -->
		<svg class="voice-mic" viewBox="0 0 24 24"><rect x="8.5" y="2.5" width="7" height="12" rx="3.5"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3.5"/></svg>
		<svg class="voice-done" viewBox="0 0 24 24"><path d="M4.5 12.5l5 5 10-11"/></svg>
		<svg class="voice-unclear" viewBox="0 0 24 24"><path d="M8.5 8.5a3.5 3.5 0 1 1 5 3.2c-.9.4-1.5 1.2-1.5 2.2v.6M12 19.5v.01"/></svg>
		<span class="voice-text">Listening</span>
	</div>
	<script src="/static/vendor/leaflet/leaflet.js"></script>   <!-- maps in slides (widgets.js) -->
	<script src="/static/vendor/qrcode/qrcode.js"></script>   <!-- QR codes in slides (widgets.js) -->
	<script src="/static/widgets.js"></script>
	<script src="/static/books_3d.js"></script>   <!-- the books slide in 3D (widgets.js) -->
	<script src="/static/bieruur_3d.js"></script>   <!-- the bieruur countdown in 3D (widgets.js) -->
	<script src="/static/instagram_3d.js"></script>   <!-- the Instagram phone in 3D (widgets.js); after the two above: it uses their helpers -->
	<script src="/static/player.js"></script>
</body>
</html>
