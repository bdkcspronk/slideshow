# spotifyd: makes the TV PC a Spotify Connect speaker called "Francken TV", so the Spotify slide can
# play music without a Spotify tab open somewhere. Used by francken-tv-spotifyd.service; see
# docs/setup/spotify.md. The login is stored in data/spotifyd (created by `spotifyd authenticate`).
[global]
device_name = "Francken TV"
device_type = "speaker"
backend = "pulseaudio"
bitrate = 320
volume_controller = "softvol"
initial_volume = 83     # sounds like 50% (the slide shows volume as heard, see heard_volume() in providers/spotify.py)
volume_normalisation = true
autoplay = true          # keep playing similar songs when a playlist or song ends
use_mpris = false
